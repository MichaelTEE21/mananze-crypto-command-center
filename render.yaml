# Render Blueprint — MCCC (Streamlit)
# Free plan: NO persistent disk (disks require paid). SQLite is ephemeral across deploys.
# Optional: upgrade plan + attach disk at /data later.
services:
  - type: web
    name: mccc
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: MCCC_DATA_DIR
        value: /opt/render/project/src/data
      - key: MCCC_DB_PATH
        value: /opt/render/project/src/data/mccc.db
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: MCCC_PRO_UNLOCK
        value: "0"
      - key: MCCC_DEV
        value: "0"
