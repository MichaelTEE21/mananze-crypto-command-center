# Render Blueprint — MCCC (Streamlit)
# PRIMARY: existing service 6b8f3cd7-4f84-4d6a-af1f-b44d1d1cf79c (do not duplicate).
# Docker + /data disk for SQLite persistence. Disks require a paid plan on NEW free
# services; keep this config for the EXISTING disk-backed service.
services:
  - type: web
    name: mccc
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: MCCC_DATA_DIR
        value: /data
      - key: MCCC_DB_PATH
        value: /data/mccc.db
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: MCCC_PRO_UNLOCK
        value: "0"
      - key: MCCC_DEV
        value: "0"
    disk:
      name: mccc-data
      mountPath: /data
      sizeGB: 1
