# Railway — same GitHub repo / Dockerfile as Render (secondary Docker host).
# Mount a volume at /data for SQLite persistence (matches Dockerfile MCCC_DATA_DIR).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
